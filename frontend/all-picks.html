<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Picks - MLB Postseason Pick'em</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<main>
  <h1>All Picks</h1>
  <p class="subtitle">Everyone's picks are revealed once a round locks - nothing is shown before then.</p>
  <div id="board"></div>
</main>

<script src="app.js"></script>
<script>
function categoryFor(roundKey) {
  const k = roundKey.toUpperCase();
  if (k.includes('WC')) return 'Wild Card';
  if (k.startsWith('ALDS') || k.startsWith('NLDS')) return 'Division Series';
  if (k === 'ALCS' || k === 'NLCS') return 'Championship Series';
  if (k === 'WS') return 'World Series';
  return 'Other Rounds';
}
const CATEGORY_ORDER = ['Wild Card', 'Division Series', 'Championship Series', 'World Series', 'Other Rounds'];

function statusBadge(rnd) {
  if (rnd.status === 'final') return `<span class="badge final">Final</span>`;
  if (rnd.locked) return `<span class="badge locked">Locked</span>`;
  if (rnd.status === 'open') return `<span class="badge open">Open</span>`;
  return `<span class="badge pending">Matchup TBD</span>`;
}

function roundCardHTML(rp) {
  const rnd = rp.round;
  const revealed = rnd.locked || rnd.status === 'final';
  let body;
  if (!revealed) {
    body = `<p class="muted">Picks are hidden until this round locks (${fmtDate(rnd.lockTime)}).</p>`;
  } else if (!rp.picks || rp.picks.length === 0) {
    body = `<p class="muted">Nobody submitted a pick for this round.</p>`;
  } else {
    body = `<div class="pick-list">` + rp.picks.map(p => `
      <div class="pick-row">
        <div class="name">${p.displayName}</div>
        <div class="detail">${p.pickedTeam}${rnd.status === 'final' && p.pickedTeam === rnd.actualWinner ? ' \u2713' : ''} &middot; in ${p.pickedLength}</div>
        ${rnd.hasMvp ? `<div class="mvp">MVP: ${p.pickedMvp || '-'}</div>` : ''}
      </div>
    `).join('') + `</div>`;
  }
  return `
    <div class="card${rnd.status === 'final' ? ' faded' : ''}">
      <div class="round-header">
        <h3>${rnd.roundName}</h3>
        ${statusBadge(rnd)}
      </div>
      ${rnd.status === 'final' ? `<p class="muted" style="margin-top:-6px;"><strong>${rnd.actualWinner}</strong> in ${rnd.actualLength}${rnd.actualMvp ? ` &middot; MVP: ${rnd.actualMvp}` : ''}</p>` : ''}
      ${body}
    </div>
  `;
}

(async () => {
  const me = await getMe();
  if (!me) { window.location.href = 'login.html'; return; }
  renderNav('all-picks', me);
  const container = document.getElementById('board');
  try {
    const data = await api('/all-picks');

    // Same rule as My Picks: a category that's entirely Final drops below
    // the ones still in progress, instead of staying pinned at the top.
    const groups = CATEGORY_ORDER
      .map(category => ({ category, inCategory: data.filter(rp => categoryFor(rp.round.roundKey) === category) }))
      .filter(g => g.inCategory.length > 0);

    const active = groups.filter(g => g.inCategory.some(rp => rp.round.status !== 'final'));
    const completed = groups.filter(g => g.inCategory.every(rp => rp.round.status === 'final'));

    let html = '';
    for (const { category, inCategory } of [...active, ...completed]) {
      const sorted = inCategory
        .slice()
        .sort((a, b) => (a.round.status === 'final' ? 1 : 0) - (b.round.status === 'final' ? 1 : 0));
      html += `<div class="section-title">${category}</div>`;
      html += `<div class="card-row">` + sorted.map(roundCardHTML).join('') + `</div>`;
    }
    container.innerHTML = html || '<p class="muted">No rounds set up yet.</p>';
  } catch (e) {
    container.innerHTML = `<p class="status-msg err">${e.message}</p>`;
  }
})();
</script>
</body>
</html>
