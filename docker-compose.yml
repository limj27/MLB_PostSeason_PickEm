services:
  pickem-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pickem_db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - pickem-net

  pickem-app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - pickem-db
    environment:
      DB_HOST: pickem-db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME}
      COOKIE_SECURE: "true"
      PORT: 8080
    # For local testing this publishes the port directly to your machine.
    # On the Pi, you can swap this back to `expose: ["8080"]` and route to
    # it via your existing Nginx path-based routing instead, the same way
    # Elite-Nine is set up.
    ports:
      - "8080:8080"
    networks:
      - pickem-net

networks:
  pickem-net:
    driver: bridge

volumes:
  pickem_db_data:
